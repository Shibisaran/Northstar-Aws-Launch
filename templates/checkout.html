{% extends 'base.html' %}{% block title %}Checkout — Northstar{% endblock %}{% block content %}<section class="checkout"><div><p class="eyebrow">Checkout</p><h1>Delivery details</h1><form method="post" class="checkout-form"><label>Full name<input required name="name" value="{{ request.form.get('name', '') }}"></label><label>Email address<input required type="email" name="email" value="{{ request.form.get('email', '') }}"></label><label>Delivery address<textarea required name="address" rows="4">{{ request.form.get('address', '') }}</textarea></label><button class="button" type="submit">Place order — {{ total|money }}</button></form></div><aside class="order-summary"><h3>Order summary</h3>{% for item in items %}<p>{{ item.product.name }} <span>×{{ item.quantity }} · {{ item.subtotal|money }}</span></p>{% endfor %}<hr><p class="total">Total <strong>{{ total|money }}</strong></p></aside></section>{% endblock %}
