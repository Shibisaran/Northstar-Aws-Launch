<article class="product-card"><a href="{{ url_for('product', slug=product.slug) }}"><img src="{{ product.image }}" alt="{{ product.name }}" loading="lazy"></a><div><p class="category">{{ product.category }}</p><h3><a href="{{ url_for('product', slug=product.slug) }}">{{ product.name }}</a></h3><p class="price">{{ product.price|money }}</p><form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="post"><button class="add" type="submit">Add to bag <span>+</span></button></form></div></article>
